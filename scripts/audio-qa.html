<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>Zengo sample QA</title>
  <style>
    body {
      font: 16px/1.5 system-ui;
      background: #15151c;
      color: #eee;
      max-width: 900px;
      margin: 3rem auto;
    }
    pre {
      white-space: pre-wrap;
    }
    a {
      color: #b5a4ff;
    }
  </style>
  <h1>Zengo sample QA</h1>
  <p>
    Checks every shipped recording using the browser's real audio decoder,
    without playing sound.
  </p>
  <pre id="results" role="status">Decoding…</pre>
  <a href="/">Back to Zengo</a>
  <script type="module">
    import { sampleNotes } from "/src/instruments.ts";
    const context = new AudioContext();
    const results = [],
      errors = [];
    for (const [instrument, notes] of Object.entries(sampleNotes)) {
      const samples = [];
      for (let i = 0; i < notes.length; i += 4) {
        await Promise.all(
          notes.slice(i, i + 4).map(async (note) => {
            try {
              const url = `/audio/${instrument}/${note.replace("#", "s")}.${instrument === "flute" ? "wav" : "mp3"}`;
              const response = await fetch(url);
              if (!response.ok) throw new Error(`${response.status} ${url}`);
              const buffer = await context.decodeAudioData(
                await response.arrayBuffer(),
              );
              const data = buffer.getChannelData(0);
              let peak = 0,
                sum = 0;
              for (const value of data) {
                peak = Math.max(peak, Math.abs(value));
                sum += value * value;
              }
              if (
                !Number.isFinite(peak) ||
                peak < 0.001 ||
                buffer.duration < 0.1
              )
                throw new Error(`Silent/truncated ${url}`);
              samples.push({
                duration: buffer.duration,
                peak,
                rms: Math.sqrt(sum / data.length),
              });
            } catch (error) {
              errors.push(String(error));
            }
          }),
        );
      }
      results.push({
        instrument,
        files: samples.length,
        shortestSeconds: Math.min(...samples.map((s) => s.duration)).toFixed(2),
        longestSeconds: Math.max(...samples.map((s) => s.duration)).toFixed(2),
        lowestPeak: Math.min(...samples.map((s) => s.peak)).toFixed(3),
      });
      document.querySelector("#results").textContent = JSON.stringify(
        { status: "running", results, errors },
        null,
        2,
      );
    }
    await context.close();
    document.querySelector("#results").textContent = JSON.stringify(
      {
        status: errors.length ? "FAILED" : "PASS",
        files: results.reduce((n, r) => n + r.files, 0),
        results,
        errors,
      },
      null,
      2,
    );
  </script>
</html>
